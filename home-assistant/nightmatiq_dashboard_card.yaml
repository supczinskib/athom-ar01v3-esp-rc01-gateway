    name: Actual light output
  - entity: number.ar01v3_esp_now_03_nightmatiq_twilight_threshold
    name: Twilight threshold
  - entity: select.ar01v3_esp_now_03_nightmatiq_mode
    name: Operating mode
  - entity: binary_sensor.ar01v3_esp_now_03_nightmatiq_mesh_ready
    name: Mesh ready
  - entity: sensor.ar01v3_esp_now_03_nightmatiq_status
    name: Status
  - entity: sensor.ar01v3_esp_now_03_nightmatiq_installed_firmware
    name: Installed firmware
  - entity: sensor.ar01v3_esp_now_03_nightmatiq_hardware_revision
    name: Hardware revision
  - entity: sensor.ar01v3_esp_now_03_nightmatiq_manufacturer
    name: Manufacturer
  - entity: sensor.ar01v3_esp_now_03_nightmatiq_company_id
    name: Company ID
  - entity: sensor.ar01v3_esp_now_03_nightmatiq_product_id
