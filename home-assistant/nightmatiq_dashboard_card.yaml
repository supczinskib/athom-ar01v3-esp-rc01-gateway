# Optional Lovelace card for NightmatIQ in the unified AR01V3 firmware.
# This example uses receiver 03. Replace every ID with the entities discovered
# for the AR01V3 selected in your installation.
type: entities
title: Steinel NightmatIQ Plus
show_header_toggle: false
entities:
