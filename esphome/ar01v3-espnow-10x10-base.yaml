# Scripts for sending stored/imported signals
script:
  - id: remote_action_refresh_ui
    mode: restart
    then:
      - lambda: |-
          if (!id(remote_action_ui_ready)) return;
          id(remote_action_ui_pilot) = std::clamp<uint8_t>(id(remote_action_ui_pilot), 1, 10);
          id(remote_action_ui_button_index) =
              std::clamp<uint8_t>(id(remote_action_ui_button_index), 0, 15);
          const size_t mapping_index =
              (static_cast<size_t>(id(remote_action_ui_pilot)) - 1U) * 16U +
              static_cast<size_t>(id(remote_action_ui_button_index));
          uint8_t action = id(remote_button_actions)[mapping_index];
          if (action > 27U) {
            action = 0;
            id(remote_button_actions)[mapping_index] = 0;
          }

          static const char *const button_labels[16] = {
              "ON", "OFF", "Night", "Brightness -", "Brightness +",
              "P1", "P2", "P3", "P4", "P5", "P6", "P7",
              "ON Hold", "OFF Hold", "Brightness + Hold", "Brightness - Hold"};
          std::string action_label;
          if (action == 0U) action_label = "Home Assistant";
          else if (action == 1U) action_label = "Ignore";
          else if (action <= 11U) action_label = "IR Slot " + std::to_string(action - 2U);
          else action_label = "RF Slot " + std::to_string(action - 12U);

          id(remote_action_ui_syncing) = true;
          id(remote_action_select).publish_state(static_cast<size_t>(action));
          id(remote_action_ui_syncing) = false;

          char status[96];
          snprintf(status, sizeof(status), "Pilot %u / %s -> %s",
                   static_cast<unsigned>(id(remote_action_ui_pilot)),
                   button_labels[id(remote_action_ui_button_index)], action_label.c_str());
          id(remote_action_status).publish_state(status);

  - id: send_raw_signal
    then:
      - lambda: |-
          id(flipper_web_importer).send_ir_slot((uint8_t) id(signal_select_index));

  - id: ir_process_pending
    mode: restart
    then:
      - delay: 150ms
      - lambda: |-
          if (!id(is_learning_mode)) return;
          bool saved = false;
          if (id(ir_pending_nec_valid)) {
            saved = id(flipper_web_importer).save_ir_nec(
                (uint8_t) id(signal_select_index), id(ir_pending_nec_address), id(ir_pending_nec_command));
            char msg[112];
            snprintf(msg, sizeof(msg), saved ? "NEC: address 0x%04X, command 0x%04X"
                                              : "NEC NVS write failed",
                     id(ir_pending_nec_address), id(ir_pending_nec_command));
            id(status_text).publish_state(msg);
          } else if (!id(ir_pending_raw).empty()) {
            saved = id(flipper_web_importer).save_ir_raw(
                (uint8_t) id(signal_select_index), id(ir_pending_raw), 38000, 50, 1);
            id(status_text).publish_state(saved ? "Saved IR RAW fallback" : "IR RAW write failed");
          }
          if (saved) id(is_learning_mode) = false;
          id(ir_pending_raw).clear();
          id(ir_pending_nec_valid) = false;

  - id: ir_learning_timeout
    mode: restart
    then:
      - delay: 20s
      - lambda: |-
          if (id(is_learning_mode)) {
            id(is_learning_mode) = false;
            id(ir_pending_raw).clear();
            id(ir_pending_nec_valid) = false;
            id(status_text).publish_state("Learning timeout");
          }

  # Timeout guard for RF learning.
  - id: rf_learning_timeout
    mode: restart
    then:
      - delay: 20s
      - lambda: |-
          if (id(is_rf_learning_mode)) {
            id(is_rf_learning_mode) = false;
            id(rf_candidate_count) = 0;
            id(rf_status_text).publish_state("Learning timeout");
            ESP_LOGW("RF_LEARNING", "No RC-Switch frame decoded before timeout");
          }

  - id: send_raw_rf_signal
    then:
      - lambda: |-
          const int repeats = std::clamp((int) id(rf_repeat_count).state, 1, 20);
          const uint32_t wait_us = (uint32_t) std::clamp(
              (int) id(rf_repeat_gap_ms).state, 0, 100) * 1000U;
          id(flipper_web_importer).send_rf_slot(
              (uint8_t) id(rf_signal_select_index), (uint32_t) repeats, wait_us);


  - id: espnow_restore_peers
    mode: single
    then:
      - if:
          condition:
            lambda: 'return id(remote_paired_1);'
          then:
            - espnow.peer.add:
                id: espnow_component
                address: !lambda 'return id(remote_mac_1);'
      - if:
          condition:
            lambda: 'return id(remote_paired_2);'
          then:
            - espnow.peer.add:
                id: espnow_component
                address: !lambda 'return id(remote_mac_2);'
      - if:
          condition:
            lambda: 'return id(remote_paired_3);'
          then:
            - espnow.peer.add:
                id: espnow_component
                address: !lambda 'return id(remote_mac_3);'
      - if:
          condition:
            lambda: 'return id(remote_paired_4);'
          then:
            - espnow.peer.add:
                id: espnow_component
                address: !lambda 'return id(remote_mac_4);'
      - if:
          condition:
            lambda: 'return id(remote_paired_5);'
          then:
            - espnow.peer.add:
                id: espnow_component
                address: !lambda 'return id(remote_mac_5);'
      - if:
          condition:
            lambda: 'return id(remote_paired_6);'
          then:
            - espnow.peer.add:
                id: espnow_component
                address: !lambda 'return id(remote_mac_6);'
      - if:
          condition:
            lambda: 'return id(remote_paired_7);'
          then:
            - espnow.peer.add:
                id: espnow_component
                address: !lambda 'return id(remote_mac_7);'
      - if:
          condition:
            lambda: 'return id(remote_paired_8);'
          then:
            - espnow.peer.add:
                id: espnow_component
                address: !lambda 'return id(remote_mac_8);'
      - if:
          condition:
            lambda: 'return id(remote_paired_9);'
          then:
            - espnow.peer.add:
                id: espnow_component
                address: !lambda 'return id(remote_mac_9);'
      - if:
          condition:
            lambda: 'return id(remote_paired_10);'
          then:
            - espnow.peer.add:
                id: espnow_component
                address: !lambda 'return id(remote_mac_10);'
      - lambda: |-
          auto publish_mac = [](bool paired, const std::array<uint8_t, 6> &mac,
                                esphome::text_sensor::TextSensor *sensor) {
            if (!paired) {
              sensor->publish_state("None");
              return;
            }
            char value[18];
            snprintf(value, sizeof(value), "%02X:%02X:%02X:%02X:%02X:%02X",
                     mac[0], mac[1], mac[2], mac[3], mac[4], mac[5]);
            sensor->publish_state(value);
          };
          publish_mac(id(remote_paired_1), id(remote_mac_1), id(remote_paired_text_1));
          publish_mac(id(remote_paired_2), id(remote_mac_2), id(remote_paired_text_2));
          publish_mac(id(remote_paired_3), id(remote_mac_3), id(remote_paired_text_3));
          publish_mac(id(remote_paired_4), id(remote_mac_4), id(remote_paired_text_4));
          publish_mac(id(remote_paired_5), id(remote_mac_5), id(remote_paired_text_5));
          publish_mac(id(remote_paired_6), id(remote_mac_6), id(remote_paired_text_6));
          publish_mac(id(remote_paired_7), id(remote_mac_7), id(remote_paired_text_7));
          publish_mac(id(remote_paired_8), id(remote_mac_8), id(remote_paired_text_8));
          publish_mac(id(remote_paired_9), id(remote_mac_9), id(remote_paired_text_9));
          publish_mac(id(remote_paired_10), id(remote_mac_10), id(remote_paired_text_10));
          id(remote_pairing_status).publish_state("Idle");

  - id: remote_pairing_timeout
    mode: restart
    then:
      - delay: 60s
      - lambda: |-
          if (id(remote_pairing) && int32_t(millis() - id(remote_pair_deadline)) >= 0) {
            id(remote_pairing) = false;
            id(remote_pairing_status).publish_state("Idle");
            ESP_LOGI("espnow_10x10", "ESP-NOW pairing window expired");
          }

  - id: remote_handle_packet
    mode: queued
    max_runs: 64
    parameters:
      remote_slot: int
      sequence: string
      button_code: int
      battery: int
    then:
      - lambda: |-
          const char *button_name = "unknown";
          int button_index = -1;
          switch (button_code) {
            case 1: button_name = "on"; button_index = 0; break;
            case 2: button_name = "off"; button_index = 1; break;
            case 3: button_name = "night"; button_index = 2; break;
            case 8: button_name = "brightness_down"; button_index = 3; break;
            case 9: button_name = "brightness_up"; button_index = 4; break;
            case 16: button_name = "p1"; button_index = 5; break;
            case 17: button_name = "p2"; button_index = 6; break;
            case 18: button_name = "p3"; button_index = 7; break;
            case 19: button_name = "p4"; button_index = 8; break;
            case 20: button_name = "p5"; button_index = 9; break;
            case 21: button_name = "p6"; button_index = 10; break;
            case 22: button_name = "p7"; button_index = 11; break;
            case 100: button_name = "on_hold"; button_index = 12; break;
            case 101: button_name = "off_hold"; button_index = 13; break;
            case 102: button_name = "brightness_up_hold"; button_index = 14; break;
            case 103: button_name = "brightness_down_hold"; button_index = 15; break;
          }

          const std::array<uint8_t, 6> *mac = &id(remote_mac_1);
          if (remote_slot == 2) mac = &id(remote_mac_2);
          else if (remote_slot == 3) mac = &id(remote_mac_3);
          else if (remote_slot == 4) mac = &id(remote_mac_4);
          else if (remote_slot == 5) mac = &id(remote_mac_5);
          else if (remote_slot == 6) mac = &id(remote_mac_6);
          else if (remote_slot == 7) mac = &id(remote_mac_7);
          else if (remote_slot == 8) mac = &id(remote_mac_8);
          else if (remote_slot == 9) mac = &id(remote_mac_9);
          else if (remote_slot == 10) mac = &id(remote_mac_10);
          char mac_text[18];
          snprintf(mac_text, sizeof(mac_text), "%02X:%02X:%02X:%02X:%02X:%02X",
                   (*mac)[0], (*mac)[1], (*mac)[2], (*mac)[3], (*mac)[4], (*mac)[5]);

          id(remote_current_button_name) = button_name;
          id(remote_current_mac) = mac_text;
          id(remote_button_code_sensor).publish_state(button_code);
          id(remote_last_button_text).publish_state(button_name);
          char slot_text[16];
          snprintf(slot_text, sizeof(slot_text), "Pilot %d", remote_slot);
          id(remote_last_slot_text).publish_state(slot_text);
          char packet_text[64];
          snprintf(packet_text, sizeof(packet_text), "%d:%s:%d", remote_slot,
                   sequence.c_str(), button_code);
          id(remote_last_packet_text).publish_state(packet_text);
          ESP_LOGI("espnow_10x10", "RX %s slot=%d seq=%s button=%s battery=%d",
                   mac_text, remote_slot, sequence.c_str(), button_name, battery);

          uint8_t action = 0;
          if (remote_slot >= 1 && remote_slot <= 10 && button_index >= 0) {
            const size_t mapping_index =
                (static_cast<size_t>(remote_slot) - 1U) * 16U +
                static_cast<size_t>(button_index);
            action = id(remote_button_actions)[mapping_index];
            if (action > 27U) action = 0;
          }
          id(remote_dispatch_to_ha) = action == 0U;

          if (action == 0U) {
            if (remote_slot == 1) id(espnow_pilot_1_button_event).trigger(button_name);
            else if (remote_slot == 2) id(espnow_pilot_2_button_event).trigger(button_name);
            else if (remote_slot == 3) id(espnow_pilot_3_button_event).trigger(button_name);
            else if (remote_slot == 4) id(espnow_pilot_4_button_event).trigger(button_name);
            else if (remote_slot == 5) id(espnow_pilot_5_button_event).trigger(button_name);
            else if (remote_slot == 6) id(espnow_pilot_6_button_event).trigger(button_name);
            else if (remote_slot == 7) id(espnow_pilot_7_button_event).trigger(button_name);
            else if (remote_slot == 8) id(espnow_pilot_8_button_event).trigger(button_name);
            else if (remote_slot == 9) id(espnow_pilot_9_button_event).trigger(button_name);
            else if (remote_slot == 10) id(espnow_pilot_10_button_event).trigger(button_name);
          } else if (action == 1U) {
            ESP_LOGI("espnow_actions", "Pilot %d button %s ignored locally",
                     remote_slot, button_name);
          } else if (action <= 11U) {
            const uint8_t slot = action - 2U;
            const bool sent = id(flipper_web_importer).send_ir_slot(slot);
            ESP_LOGI("espnow_actions", "Pilot %d button %s -> IR slot %u: %s",
                     remote_slot, button_name, static_cast<unsigned>(slot),
                     sent ? "sent" : "failed");
          } else {
            const uint8_t slot = action - 12U;
            const float repeat_state = id(rf_repeat_count).state;
            const float gap_state = id(rf_repeat_gap_ms).state;
            const uint32_t repeats = repeat_state >= 1.0f && repeat_state <= 20.0f
                ? static_cast<uint32_t>(repeat_state) : 5U;
            const uint32_t gap_ms = gap_state >= 0.0f && gap_state <= 50.0f
                ? static_cast<uint32_t>(gap_state) : 0U;
            const bool sent = id(flipper_web_importer).send_rf_slot(slot, repeats, gap_ms * 1000U);
            ESP_LOGI("espnow_actions", "Pilot %d button %s -> RF slot %u: %s",
                     remote_slot, button_name, static_cast<unsigned>(slot),
                     sent ? "sent" : "failed");
          }

      - if:
          condition:
            lambda: 'return id(remote_dispatch_to_ha);'
          then:
            - homeassistant.event:
                event: esphome.esp_rc01_raw
                data:
                  receiver: "${receiver_id}"
                data_template:
                  remote_slot: "{{ remote_slot }}"
                  sequence: "{{ sequence }}"
                  button_code: "{{ button_code }}"
                  button: "{{ button }}"
                  battery: "{{ battery }}"
                  remote_mac: "{{ remote_mac }}"
                variables:
                  remote_slot: !lambda 'return remote_slot;'
                  sequence: !lambda 'return sequence;'
                  button_code: !lambda 'return button_code;'
                  button: !lambda 'return id(remote_current_button_name);'
                  battery: !lambda 'return battery;'
                  remote_mac: !lambda 'return id(remote_current_mac);'

time:
  - platform: sntp
    id: sntp_time
  # Define the timezone of the device
    timezone: "${timezone}"
  # Change sync interval from default 5min to 6 hours (or as set in substitutions)
    update_interval: ${sntp_update_interval}
  # Set specific sntp servers to use
    servers:
      - "${sntp_server_1}"
      - "${sntp_server_2}"
      - "${sntp_server_3}"
  # Publish the time the device was last restarted
    on_time_sync:
      then:
        # Update last restart time, but only once.
        - if:
            condition:
              lambda: 'return id(device_last_restart).state == "";'
            then:
              - text_sensor.template.publish:
                  id: device_last_restart
                  state: !lambda 'return id(sntp_time).now().strftime("%a %d %b %Y - %I:%M:%S %p");'
