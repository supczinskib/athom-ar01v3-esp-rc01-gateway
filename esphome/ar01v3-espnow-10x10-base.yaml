            else if (id(remote_paired_9) && memcmp(id(remote_mac_9).data(), info.src_addr, 6) == 0) slot = 9;
            else if (id(remote_paired_10) && memcmp(id(remote_mac_10).data(), info.src_addr, 6) == 0) slot = 10;
            if (slot == 0) return false;

            const uint32_t seq = uint32_t(data[1]) | (uint32_t(data[2]) << 8) |
                                 (uint32_t(data[3]) << 16) | (uint32_t(data[4]) << 24);
            const uint8_t button = data[6];
            const uint8_t battery = data[8];

            if (slot == 1) {
              id(remote_battery_1).publish_state(battery);
              if (seq == id(remote_last_seq_1)) return false;
