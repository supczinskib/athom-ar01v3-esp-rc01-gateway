            }
            else if (slot == 8) {
              id(remote_battery_8).publish_state(battery);
              if (seq == id(remote_last_seq_8)) return false;
              id(remote_last_seq_8) = seq;
            }
            else if (slot == 9) {
              id(remote_battery_9).publish_state(battery);
              if (seq == id(remote_last_seq_9)) return false;
              id(remote_last_seq_9) = seq;
            }
            else if (slot == 10) {
              id(remote_battery_10).publish_state(battery);
              if (seq == id(remote_last_seq_10)) return false;
              id(remote_last_seq_10) = seq;
            }

            char src[18];
            snprintf(src, sizeof(src), "%02X:%02X:%02X:%02X:%02X:%02X",
                     info.src_addr[0], info.src_addr[1], info.src_addr[2],
                     info.src_addr[3], info.src_addr[4], info.src_addr[5]);
            id(remote_last_seen).publish_state(src);
            id(remote_rx_slot) = slot;
            id(remote_rx_seq) = seq;
            id(remote_rx_button) = button;
            id(remote_rx_battery) = battery;
            ESP_LOGD(TAG, "pilot=%d button=%u seq=%lu battery=%u",
                     slot, unsigned(button), static_cast<unsigned long>(seq), unsigned(battery));
            return true;
        then:
          - script.execute:
              id: remote_handle_packet
              remote_slot: !lambda 'return id(remote_rx_slot);'
              sequence: !lambda 'return std::to_string(id(remote_rx_seq));'
              button_code: !lambda 'return id(remote_rx_button);'
              battery: !lambda 'return id(remote_rx_battery);'

  # Broadcast packets can be delivered through a separate callback. The local sequence
  # check ensures one physical packet is handled once per AR01V3.
  on_broadcast:
