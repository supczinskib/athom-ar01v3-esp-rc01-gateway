          id(remote_pairing) = true;
          id(remote_pair_deadline) = millis() + 60000;
          char status[64];
          snprintf(status, sizeof(status), "Pairing Pilot %d for 60 seconds", id(remote_pairing_slot));
          id(remote_pairing_status).publish_state(status);
          ESP_LOGI("espnow_10x10", "Pairing slot %d enabled for 60 seconds", id(remote_pairing_slot));
      - script.execute: remote_pairing_timeout

  - platform: template
    name: "Clear Selected ESP-NOW Remote"
    id: clear_espnow_remote
    icon: mdi:link-off
    entity_category: config
    on_press:
      - if:
          condition:
            lambda: |-
              const int slot = id(remote_pairing_slot);
              return (slot == 1 && id(remote_paired_1)) ||
                     (slot == 2 && id(remote_paired_2)) ||
                     (slot == 3 && id(remote_paired_3)) ||
                     (slot == 4 && id(remote_paired_4)) ||
                     (slot == 5 && id(remote_paired_5)) ||
                     (slot == 6 && id(remote_paired_6)) ||
                     (slot == 7 && id(remote_paired_7)) ||
                     (slot == 8 && id(remote_paired_8)) ||
                     (slot == 9 && id(remote_paired_9)) ||
                     (slot == 10 && id(remote_paired_10));
          then:
            - espnow.peer.delete:
                id: espnow_component
                address: !lambda |-
                  if (id(remote_pairing_slot) == 1) return id(remote_mac_1);
                  if (id(remote_pairing_slot) == 2) return id(remote_mac_2);
                  if (id(remote_pairing_slot) == 3) return id(remote_mac_3);
                  if (id(remote_pairing_slot) == 4) return id(remote_mac_4);
                  if (id(remote_pairing_slot) == 5) return id(remote_mac_5);
                  if (id(remote_pairing_slot) == 6) return id(remote_mac_6);
                  if (id(remote_pairing_slot) == 7) return id(remote_mac_7);
                  if (id(remote_pairing_slot) == 8) return id(remote_mac_8);
                  if (id(remote_pairing_slot) == 9) return id(remote_mac_9);
                  return id(remote_mac_10);
      - lambda: |-
          const int slot = id(remote_pairing_slot);
          if (slot == 1) {
            id(remote_mac_1) = std::array<uint8_t, 6>{0, 0, 0, 0, 0, 0};
            id(remote_paired_1) = false;
            id(remote_last_seq_1) = 0xFFFFFFFF;
            id(remote_paired_text_1).publish_state("None");
          }
          else if (slot == 2) {
            id(remote_mac_2) = std::array<uint8_t, 6>{0, 0, 0, 0, 0, 0};
            id(remote_paired_2) = false;
            id(remote_last_seq_2) = 0xFFFFFFFF;
            id(remote_paired_text_2).publish_state("None");
          }
          else if (slot == 3) {
            id(remote_mac_3) = std::array<uint8_t, 6>{0, 0, 0, 0, 0, 0};
            id(remote_paired_3) = false;
            id(remote_last_seq_3) = 0xFFFFFFFF;
            id(remote_paired_text_3).publish_state("None");
          }
          else if (slot == 4) {
            id(remote_mac_4) = std::array<uint8_t, 6>{0, 0, 0, 0, 0, 0};
            id(remote_paired_4) = false;
            id(remote_last_seq_4) = 0xFFFFFFFF;
            id(remote_paired_text_4).publish_state("None");
          }
          else if (slot == 5) {
            id(remote_mac_5) = std::array<uint8_t, 6>{0, 0, 0, 0, 0, 0};
            id(remote_paired_5) = false;
            id(remote_last_seq_5) = 0xFFFFFFFF;
            id(remote_paired_text_5).publish_state("None");
          }
          else if (slot == 6) {
            id(remote_mac_6) = std::array<uint8_t, 6>{0, 0, 0, 0, 0, 0};
            id(remote_paired_6) = false;
            id(remote_last_seq_6) = 0xFFFFFFFF;
            id(remote_paired_text_6).publish_state("None");
          }
          else if (slot == 7) {
            id(remote_mac_7) = std::array<uint8_t, 6>{0, 0, 0, 0, 0, 0};
            id(remote_paired_7) = false;
            id(remote_last_seq_7) = 0xFFFFFFFF;
            id(remote_paired_text_7).publish_state("None");
          }
          else if (slot == 8) {
            id(remote_mac_8) = std::array<uint8_t, 6>{0, 0, 0, 0, 0, 0};
            id(remote_paired_8) = false;
            id(remote_last_seq_8) = 0xFFFFFFFF;
            id(remote_paired_text_8).publish_state("None");
          }
          else if (slot == 9) {
            id(remote_mac_9) = std::array<uint8_t, 6>{0, 0, 0, 0, 0, 0};
            id(remote_paired_9) = false;
            id(remote_last_seq_9) = 0xFFFFFFFF;
            id(remote_paired_text_9).publish_state("None");
          }
          else if (slot == 10) {
            id(remote_mac_10) = std::array<uint8_t, 6>{0, 0, 0, 0, 0, 0};
            id(remote_paired_10) = false;
            id(remote_last_seq_10) = 0xFFFFFFFF;
            id(remote_paired_text_10).publish_state("None");
          }
          id(remote_pairing) = false;
          char status[48];
          snprintf(status, sizeof(status), "Pilot %d cleared", slot);
          id(remote_pairing_status).publish_state(status);
          ESP_LOGI("espnow_10x10", "Cleared ESP-NOW Pilot %d", slot);

