# Select the logical pilot slot used by Pair/Clear.
# Keep the mapping identical on every AR01V3: the same physical remote must always use the same slot.
select:
  - platform: template
    name: "Pilot"
    id: remote_action_pilot_select
    icon: mdi:remote
    internal: true
    optimistic: true
    options:
      - "Pilot 1"
      - "Pilot 2"
      - "Pilot 3"
      - "Pilot 4"
      - "Pilot 5"
      - "Pilot 6"
      - "Pilot 7"
      - "Pilot 8"
      - "Pilot 9"
      - "Pilot 10"
    initial_option: "Pilot 1"
    web_server:
      sorting_group_id: group_remote_actions
      sorting_weight: 1
    on_value:
      - lambda: |-
          id(remote_action_ui_pilot) = static_cast<uint8_t>(i + 1);
      - script.execute: remote_action_refresh_ui

  - platform: template
    name: "Button"
    id: remote_action_button_select
    icon: mdi:gesture-tap-button
