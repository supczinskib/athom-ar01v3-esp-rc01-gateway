    on_press:
      - lambda: |-
          id(ir_pending_raw).clear();
          id(ir_pending_nec_valid) = false;
          id(is_learning_mode) = true;
          id(ir_learn_deadline) = millis() + 20000;
          ESP_LOGI("IR_LEARNING", "Learning mode activated for slot %d", id(signal_select_index));
          id(status_text).publish_state("Ready: press the IR remote button");
      - script.execute: ir_learning_timeout

