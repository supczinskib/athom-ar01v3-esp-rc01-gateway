esp32_ble_tracker:
  scan_parameters:
    # Don't auto start BLE scanning, we control it in the `api` block's automation.
    continuous: false
    active: true  # send scan-request packets to gather more info, like device name for some devices.
    interval: 320ms  # default 320ms - how long to spend on each advert channel
    window: 30ms
    # If the device cannot keep up or becomes unstable, reduce the "window" setting. This may be
    # required if your device is controlling other sensors or doing PWM for lights etc.

bluetooth_proxy:
  active: true
  # Preserve active BLE proxying with a lower peak RAM requirement.
  connection_slots: 2

captive_portal:

esp32_improv:
  authorizer: none


# Use the vendored Flash storage component included in this package.
# This avoids fetching mutable code from GitHub during validation or compilation.
external_components:
  - source:
      type: local
      path: components
    components: [Flash_comp, flipper_importer]

remote_receiver:
  - pin:
      number: ${RF_RX_PIN}
      inverted: true
    # Athom v3.0.7 vendor baseline for AR01V3 GPIO19. Learning is accepted only
    # after ESPHome has decoded a fixed-code RC-Switch frame; ambient RAW chatter
    # is never written to a slot.
    dump: rc_switch
    filter: 50us
    idle: 10ms
    tolerance: 50%
    id: rf_receiver
    on_rc_switch:
      - lambda: |-
          if (!id(is_rf_learning_mode)) return;
          if (id(rf_candidate_count) > 0 &&
              id(rf_candidate_protocol) == x.protocol &&
              id(rf_candidate_code) == x.code) {
            id(rf_candidate_count)++;
          } else {
            id(rf_candidate_protocol) = x.protocol;
            id(rf_candidate_code) = x.code;
            id(rf_candidate_count) = 1;
          }
          ESP_LOGI("RF_LEARNING", "Candidate %u/3: protocol=%u code=0x%llX",
                   id(rf_candidate_count), x.protocol, (unsigned long long) x.code);
          if (id(rf_candidate_count) < 3) return;

          id(is_rf_learning_mode) = false;
          const bool saved = id(flipper_web_importer).save_rf_rc_switch(
              (uint8_t) id(rf_signal_select_index), id(rf_candidate_code),
              id(rf_candidate_protocol), 5);
          if (saved) {
            char message[128];
            if (id(rf_candidate_protocol) == 6)
              std::snprintf(message, sizeof(message),
                            "Learned RX protocol 6 code 0x%llX; saved as Princeton TX TE403",
                            (unsigned long long) id(rf_candidate_code));
            else
              std::snprintf(message, sizeof(message),
                            "Learned RC-Switch protocol %u, code 0x%llX (3 matches, 24-bit)",
                            id(rf_candidate_protocol),
                            (unsigned long long) id(rf_candidate_code));
            id(rf_status_text).publish_state(message);
            ESP_LOGI("RF_LEARNING", "%s", message);
          } else {
            id(rf_status_text).publish_state("RF save failed");
            ESP_LOGE("RF_LEARNING", "Could not save decoded RF signal");
          }

  - pin:
      number: ${IR_RX_PIN}
      inverted: true
    dump: all
    tolerance: 25%
    idle: 65500us
    clock_resolution: "500000"
    id: ir_receiver
    on_nec:
      - lambda: |-
          if (!id(is_learning_mode)) return;
          id(ir_pending_nec_valid) = true;
          id(ir_pending_nec_address) = x.address;
          id(ir_pending_nec_command) = x.command;
          ESP_LOGI("IR_LEARNING", "Decoded NEC address=0x%04X command=0x%04X",
                   x.address, x.command);
      - script.execute: ir_process_pending
    on_raw:
      - lambda: |-
          if (!id(is_learning_mode)) return;
          if ((int32_t) (millis() - id(ir_learn_deadline)) >= 0) {
            id(is_learning_mode) = false;
            id(status_text).publish_state("Learning timeout");
            return;
          }
          if (x.size() > id(filter_size)) id(ir_pending_raw) = x;
      - script.execute: ir_process_pending

remote_transmitter:
  - pin:
      number: ${RF_TX_PIN}
    # OOK modulation for RF433 — keep duty at 100%
    carrier_duty_percent: 100%
    non_blocking: true
    id: rf_transmitter

  - pin:
      number: ${IR_TX_PIN}
      inverted: false
    carrier_duty_percent: 50%
    non_blocking: true
    id: ir_transmitter

