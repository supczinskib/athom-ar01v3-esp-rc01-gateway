substitutions:
  # Default name
  name: "athom-rf-ir-remote"
  # Default friendly name
  friendly_name: "Athom RF IR Remote"
  # Allows ESP device to be automatically linked to an 'Area' in Home Assistant. Typically used for areas such as 'Lounge Room', 'Kitchen' etc
  room: ""
  # Description as appears in ESPHome & top of webserver page
  device_description: "Athom AR01V3 RF/IR bridge with protocol-aware learning, Flipper import, 10x ESP-RC01 reception and HA deduplication"
  # Project Name
  project_name: "envpl.ar01v3_esp_rc01_gateway"
  # Projection version denotes the release version of the yaml file, allowing checking of deployed vs latest version
  project_version: "1.1.1"
  # Stable identifier included in events sent to Home Assistant
  receiver_id: "ar01v3_1"
  # Define a domain for this device to use. i.e. iot.home.lan (so device will appear as athom-smart-plug-v2.iot.home.lan in DNS/DHCP logs)
  dns_domain: ".local"
  # Set timezone of the smart plug. Useful if the plug is in a location different to the HA server. Can be entered in unix Country/Area format (i.e. "Australia/Sydney")
  timezone: ""
  # Set the duration between the sntp service polling ntp.org servers for an update
  sntp_update_interval: 6h
  # Network time servers for your region, enter from lowest to highest priority. To use local servers update as per zones or countries at: https://www.ntppool.org/zone/@
  sntp_server_1: "0.pool.ntp.org"
  sntp_server_2: "1.pool.ntp.org"
  sntp_server_3: "2.pool.ntp.org"
  # Enables faster network connections, with last connected SSID being connected to and no full scan for SSID being undertaken
  wifi_fast_connect: "false"
  # Define logging level: NONE, ERROR, WARN, INFO, DEBUG (Default), VERBOSE, VERY_VERBOSE
  log_level: "INFO"
  # Enable or disable the use of IPv6 networking on the device
  ipv6_enable: "false"
  # valid value: ballu, coolix, daikin, daikin_arc, daikin_brc, delonghi, emmeti, fujitsu_general, gree, hitachi_ac344, hitachi_ac424, climate_ir_lg, midea_ir, mitsubishi, noblex, tcl112, toshiba, whirlpool, yashima, whynter, zhlt01, heatpumpir
  # https://esphome.io/components/climate/climate_ir/
  AC_Platform_name: "coolix"

#########################GPIO######################
  RF_RX_PIN: GPIO19
  RF_TX_PIN: GPIO18
  IR_RX_PIN: GPIO33
  IR_TX_PIN: GPIO25
  Button_PIN: GPIO0
  LED_PIN: GPIO27
#########################GPIO######################

esphome:
  name: "${name}"
  friendly_name: "${friendly_name}"
  comment: "${device_description}"
  area: "${room}"
  devices:
    - id: ha_slot_actions_device
      name: "AR01V3 Stored Signal Actions"
  name_add_mac_suffix: false
  min_version: 2026.7.3
  project:
    name: "${project_name}"
    version: "${project_version}"
  platformio_options:
    board_build.flash_mode: dio
  on_boot:
    - priority: -100
      then:
        - script.execute: espnow_restore_peers
        - lambda: |-
            id(signal_select_index) = std::clamp(id(signal_select_index), 0, 9);
            id(rf_signal_select_index) = std::clamp(id(rf_signal_select_index), 0, 15);
            id(signal_slot_select).publish_state("Signal " + std::to_string(id(signal_select_index)));
            id(rf_signal_slot_select).publish_state("Signal " + std::to_string(id(rf_signal_select_index)));
            id(remote_action_ui_ready) = true;
        - script.execute: remote_action_refresh_ui

esp32:
  board: esp32dev
  variant: esp32
  flash_size: 8MB
  framework:
    type: esp-idf
    version: recommended
    sdkconfig_options:
      # @grigi found in testing that these options resulted in better responsiveness.
      # BLE 4.2 is supported by ALL ESP32 boards that have bluetooth, the original and derivatives.
      CONFIG_BT_BLE_42_FEATURES_SUPPORTED: y
      # Extend the watchdog timeout, so the device reboots if the device appears locked up for over 10 seconds.
      CONFIG_ESP_TASK_WDT_TIMEOUT_S: "10"

preferences:
  flash_write_interval: 5s

# Global variables for IR learning
globals:
  - id: is_learning_mode
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: signal_select_index
    type: int
    restore_value: yes
    initial_value: '0'
  - id: filter_size
    type: int
    restore_value: no
    initial_value: '10'
  - id: ir_learn_deadline
    type: uint32_t
    restore_value: no
    initial_value: '0'
  - id: ir_pending_raw
    type: std::vector<int32_t>
    restore_value: no
  - id: ir_pending_nec_valid
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: ir_pending_nec_address
    type: uint16_t
    restore_value: no
    initial_value: '0'
  - id: ir_pending_nec_command
    type: uint16_t
    restore_value: no
    initial_value: '0'
  # RF433 learning mode flag (independent from IR learning)
  - id: is_rf_learning_mode
    type: bool
    restore_value: no
    initial_value: 'false'
  # Logical RF slot 0-15. The storage component applies the NVS offset +10.
  - id: rf_signal_select_index
    type: int
    restore_value: yes
    initial_value: '0'
  # A single RC-Switch decode can be a short false match. Require three
  # consecutive identical protocol+code callbacks before writing the slot.
  - id: rf_candidate_code
    type: uint64_t
    restore_value: no
    initial_value: '0'
  - id: rf_candidate_protocol
    type: uint8_t
    restore_value: no
    initial_value: '0'
  - id: rf_candidate_count
    type: uint8_t
    restore_value: no
    initial_value: '0'

  # ESP-NOW: ten paired ESP-RC01 remotes per receiver
  - id: remote_mac_1
    type: std::array<uint8_t, 6>
    restore_value: yes
    initial_value: "std::array<uint8_t, 6>{0, 0, 0, 0, 0, 0}"
  - id: remote_mac_2
    type: std::array<uint8_t, 6>
    restore_value: yes
    initial_value: "std::array<uint8_t, 6>{0, 0, 0, 0, 0, 0}"
  - id: remote_mac_3
    type: std::array<uint8_t, 6>
    restore_value: yes
    initial_value: "std::array<uint8_t, 6>{0, 0, 0, 0, 0, 0}"
  - id: remote_mac_4
    type: std::array<uint8_t, 6>
    restore_value: yes
    initial_value: "std::array<uint8_t, 6>{0, 0, 0, 0, 0, 0}"
  - id: remote_mac_5
    type: std::array<uint8_t, 6>
    restore_value: yes
    initial_value: "std::array<uint8_t, 6>{0, 0, 0, 0, 0, 0}"
  - id: remote_mac_6
    type: std::array<uint8_t, 6>
    restore_value: yes
    initial_value: "std::array<uint8_t, 6>{0, 0, 0, 0, 0, 0}"
  - id: remote_mac_7
    type: std::array<uint8_t, 6>
    restore_value: yes
    initial_value: "std::array<uint8_t, 6>{0, 0, 0, 0, 0, 0}"
  - id: remote_mac_8
    type: std::array<uint8_t, 6>
    restore_value: yes
    initial_value: "std::array<uint8_t, 6>{0, 0, 0, 0, 0, 0}"
  - id: remote_mac_9
    type: std::array<uint8_t, 6>
    restore_value: yes
    initial_value: "std::array<uint8_t, 6>{0, 0, 0, 0, 0, 0}"
  - id: remote_mac_10
    type: std::array<uint8_t, 6>
    restore_value: yes
    initial_value: "std::array<uint8_t, 6>{0, 0, 0, 0, 0, 0}"
  - id: remote_paired_1
    type: bool
    restore_value: yes
    initial_value: "false"
  - id: remote_paired_2
    type: bool
    restore_value: yes
    initial_value: "false"
  - id: remote_paired_3
    type: bool
    restore_value: yes
    initial_value: "false"
  - id: remote_paired_4
    type: bool
    restore_value: yes
    initial_value: "false"
  - id: remote_paired_5
    type: bool
    restore_value: yes
    initial_value: "false"
  - id: remote_paired_6
    type: bool
    restore_value: yes
    initial_value: "false"
  - id: remote_paired_7
    type: bool
    restore_value: yes
    initial_value: "false"
  - id: remote_paired_8
    type: bool
    restore_value: yes
    initial_value: "false"
  - id: remote_paired_9
    type: bool
    restore_value: yes
    initial_value: "false"
  - id: remote_paired_10
    type: bool
    restore_value: yes
    initial_value: "false"

  # Local duplicate suppression inside one receiver. Sequence is RAM-only.
  - id: remote_last_seq_1
    type: uint32_t
    restore_value: no
    initial_value: "0xFFFFFFFF"
  - id: remote_last_seq_2
    type: uint32_t
    restore_value: no
    initial_value: "0xFFFFFFFF"
  - id: remote_last_seq_3
    type: uint32_t
    restore_value: no
    initial_value: "0xFFFFFFFF"
  - id: remote_last_seq_4
    type: uint32_t
    restore_value: no
    initial_value: "0xFFFFFFFF"
  - id: remote_last_seq_5
    type: uint32_t
    restore_value: no
    initial_value: "0xFFFFFFFF"
  - id: remote_last_seq_6
    type: uint32_t
    restore_value: no
    initial_value: "0xFFFFFFFF"
  - id: remote_last_seq_7
    type: uint32_t
    restore_value: no
    initial_value: "0xFFFFFFFF"
  - id: remote_last_seq_8
    type: uint32_t
    restore_value: no
    initial_value: "0xFFFFFFFF"
  - id: remote_last_seq_9
    type: uint32_t
    restore_value: no
    initial_value: "0xFFFFFFFF"
  - id: remote_last_seq_10
    type: uint32_t
    restore_value: no
    initial_value: "0xFFFFFFFF"

  # Pairing state; slot 1..10 must represent the same physical remote on every AR01V3
  - id: remote_pairing_slot
    type: int
    restore_value: yes
    initial_value: "1"
  - id: remote_pairing
    type: bool
    restore_value: no
    initial_value: "false"
  - id: remote_pair_deadline
    type: uint32_t
    restore_value: no
    initial_value: "0"

  # Temporary peer operations used by on_unknown_peer
  - id: remote_peer_add_pending
    type: bool
    restore_value: no
    initial_value: "false"
  - id: remote_peer_delete_pending
    type: bool
    restore_value: no
    initial_value: "false"
  - id: remote_peer_add_mac
    type: std::array<uint8_t, 6>
    restore_value: no
    initial_value: "std::array<uint8_t, 6>{0, 0, 0, 0, 0, 0}"
  - id: remote_peer_delete_mac
    type: std::array<uint8_t, 6>
    restore_value: no
    initial_value: "std::array<uint8_t, 6>{0, 0, 0, 0, 0, 0}"

  # Packet values copied before the queued handler is called
  - id: remote_rx_slot
    type: int
    restore_value: no
    initial_value: "0"
  - id: remote_rx_seq
    type: uint32_t
    restore_value: no
    initial_value: "0"
  - id: remote_rx_button
    type: uint8_t
    restore_value: no
    initial_value: "0"
  - id: remote_rx_battery
    type: uint8_t
    restore_value: no
    initial_value: "0"
  - id: remote_current_button_name
    type: std::string
    restore_value: no
    initial_value: '"unknown"'
  - id: remote_current_mac
    type: std::string
    restore_value: no
    initial_value: '"00:00:00:00:00:00"'

  # Per-receiver ESP-RC01 actions. Each byte represents one Pilot/Button pair:
  # 0 = Home Assistant, 1 = Ignore, 2..11 = IR slot 0..9,
  # 12..27 = RF slot 0..15. The zero-filled default preserves v1.0 behavior.
  - id: remote_button_actions
    type: std::array<uint8_t, 160>
    restore_value: yes
    initial_value: "std::array<uint8_t, 160>{}"
  - id: remote_action_ui_pilot
    type: uint8_t
    restore_value: no
    initial_value: "1"
  - id: remote_action_ui_button_index
    type: uint8_t
    restore_value: no
    initial_value: "5"
  - id: remote_action_ui_ready
    type: bool
    restore_value: no
    initial_value: "false"
  - id: remote_action_ui_syncing
    type: bool
    restore_value: no
    initial_value: "false"
  - id: remote_dispatch_to_ha
    type: bool
    restore_value: no
    initial_value: "true"
# Flash storage component for saving IR/RF signals
Flash_comp:
  id: signal_nvs

# Authenticated local page: http://DEVICE/flipper
# Imports Flipper .ir/.sub files into the same slots used by IR/RF buttons.
flipper_importer:
  id: flipper_web_importer
  storage_id: signal_nvs
  ir_transmitter_id: ir_transmitter
  rf_transmitter_id: rf_transmitter
  ir_status_id: status_text
  rf_status_id: rf_status_text
  ir_slot_status_ids:
    - ir_slot_status_0
    - ir_slot_status_1
    - ir_slot_status_2
    - ir_slot_status_3
    - ir_slot_status_4
    - ir_slot_status_5
    - ir_slot_status_6
    - ir_slot_status_7
    - ir_slot_status_8
    - ir_slot_status_9
  rf_slot_status_ids:
    - rf_slot_status_0
    - rf_slot_status_1
    - rf_slot_status_2
    - rf_slot_status_3
    - rf_slot_status_4
    - rf_slot_status_5
    - rf_slot_status_6
    - rf_slot_status_7
    - rf_slot_status_8
    - rf_slot_status_9
    - rf_slot_status_10
    - rf_slot_status_11
    - rf_slot_status_12
    - rf_slot_status_13
    - rf_slot_status_14
    - rf_slot_status_15

api:
  reboot_timeout: 0s
  actions:
    # Fire-and-forget variants intentionally have no response mode. Home
    # Assistant presents their scalar variables as an editable action form.
    - action: transmit_ir_nec
      variables:
        address: int
        command: int
        repeats: int
      then:
        - lambda: |-
            id(flipper_web_importer).send_ir_nec_now(address, command, repeats);

    - action: transmit_ir_raw
      variables:
        timings: string
        carrier_hz: int
        duty_percent: int
        repeats: int
      then:
        - lambda: |-
            id(flipper_web_importer).send_ir_raw_text_now(
                timings, carrier_hz, duty_percent, repeats);

    - action: transmit_rf_princeton
      variables:
        code_hex: string
        bit_count: int
        te_us: int
        guard_multiplier: int
        repeats: int
        gap_ms: int
      then:
        - lambda: |-
            id(flipper_web_importer).send_rf_princeton_now(
                code_hex, bit_count, te_us, guard_multiplier, repeats, gap_ms);

    - action: transmit_rf_dooya
      variables:
        code_hex: string
        repeats: int
      then:
        - lambda: |-
            id(flipper_web_importer).send_rf_dooya_now(code_hex, repeats);

    - action: transmit_rf_raw
      variables:
        timings: string
        repeats: int
        gap_ms: int
      then:
        - lambda: |-
            id(flipper_web_importer).send_rf_raw_text_now(timings, repeats, gap_ms);

    # Send records already learned or imported into an AR01 slot. These actions
    # avoid the shared slot selector and are safe to use from HA virtual devices.
    - action: send_ir_slot
      supports_response: status
      variables:
        slot: int
      then:
        - if:
            condition:
              lambda: |-
                return slot >= 0 && slot < 10 &&
                    id(flipper_web_importer).send_ir_slot((uint8_t) slot);
            then:
              - api.respond:
                  success: true
            else:
              - api.respond:
                  success: false
                  error_message: "IR slot must be 0..9 and contain a valid signal"

    - action: send_rf_slot
      supports_response: status
      variables:
        slot: int
        repeats: int
        gap_ms: int
      then:
        - if:
            condition:
              lambda: |-
                return slot >= 0 && slot < 16 && repeats >= 1 && repeats <= 20 &&
                    gap_ms >= 0 && gap_ms <= 100 &&
                    id(flipper_web_importer).send_rf_slot(
                        (uint8_t) slot, (uint32_t) repeats, (uint32_t) gap_ms * 1000U);
            then:
              - api.respond:
                  success: true
            else:
              - api.respond:
                  success: false
                  error_message: "RF slot must be 0..15, repeats 1..20, gap 0..100 ms, and contain a valid signal"

    - action: send_ir_raw
      supports_response: status
      variables:
        timings: string
        carrier_hz: int
        duty_percent: int
        repeats: int
      then:
        - if:
            condition:
              lambda: |-
                return id(flipper_web_importer).send_ir_raw_text_now(
                    timings, carrier_hz, duty_percent, repeats);
            then:
              - api.respond:
                  success: true
            else:
              - api.respond:
                  success: false
                  error_message: "Invalid dynamic IR RAW parameters"

    - action: send_ir_nec
      supports_response: status
      variables:
        address: int
        command: int
        repeats: int
      then:
        - if:
            condition:
              lambda: |-
                return id(flipper_web_importer).send_ir_nec_now(address, command, repeats);
            then:
              - api.respond:
                  success: true
            else:
              - api.respond:
                  success: false
                  error_message: "Invalid dynamic NEC parameters"

    - action: send_rf_raw
      supports_response: status
      variables:
        timings: string
        repeats: int
        gap_ms: int
      then:
        - if:
            condition:
              lambda: |-
                return id(flipper_web_importer).send_rf_raw_text_now(timings, repeats, gap_ms);
            then:
              - api.respond:
                  success: true
            else:
              - api.respond:
                  success: false
                  error_message: "Invalid dynamic RF RAW parameters"

    - action: send_rf_princeton
      supports_response: status
      variables:
        code_hex: string
        bit_count: int
        te_us: int
        guard_multiplier: int
        repeats: int
        gap_ms: int
      then:
        - if:
            condition:
              lambda: |-
                return id(flipper_web_importer).send_rf_princeton_now(
                    code_hex, bit_count, te_us, guard_multiplier, repeats, gap_ms);
            then:
              - api.respond:
                  success: true
            else:
              - api.respond:
                  success: false
                  error_message: "Invalid dynamic Princeton parameters"

    - action: send_rf_dooya
      supports_response: status
      variables:
        code_hex: string
        repeats: int
      then:
        - if:
            condition:
              lambda: |-
                return id(flipper_web_importer).send_rf_dooya_now(code_hex, repeats);
            then:
              - api.respond:
                  success: true
            else:
              - api.respond:
                  success: false
                  error_message: "Invalid dynamic Dooya parameters"
  # Initial Home Assistant discovery and BLE scanning temporarily compete for
  # the same heap. Let the API finish listing entities and actions first.
  on_client_connected:
    - delay: 10s
    - if:
        condition:
          api.connected:
        then:
          - esp32_ble_tracker.start_scan:
              continuous: true
  # Disable BLE tracking when there are no api connections live
  on_client_disconnected:
    if:
      condition:
        not:
          api.connected:
      then:
        - esp32_ble_tracker.stop_scan:

ota:
  - platform: esphome
    id: ota_esphome
    password: !secret ota_password

logger:
  baud_rate: 0
  level: ${log_level}

mdns:
  disabled: false

web_server:
  port: 80
  version: 3
  # Use ESPHome's built-in, authenticated /0.js handler. The earlier custom
  # handler could close the connection without sending the helper body.
  # Keep a versioned resource name. ESPHome's generated-source cache does not
  # reliably invalidate an embedded js_include when only its contents change.
  # Use one complete local frontend. Its entity table contains the firmware's
  # sorting groups directly, so rendering does not depend on SSE listener order.
  js_url: ""
  js_include: ar01v3_web_v3.js
  # Pilot/Button/Action are local web controls. Keep them off the native API
  # entity listing to reduce heap use during Home Assistant discovery.
  include_internal: true
  sorting_groups:
    - id: group_remote_actions
      name: "ESP-RC01 Button Assignment"
      sorting_weight: 3
    - id: group_signal_import
      name: "Flipper File Import"
      sorting_weight: 4
    - id: group_ir_signals
      name: "IR Signals"
      sorting_weight: 5
    - id: group_rf_signals
      name: "RF 433.92 MHz Signals"
      sorting_weight: 6
    - id: group_ha_slot_actions
      name: "Home Assistant Slot Buttons"
      sorting_weight: 90
  auth:
    type: digest
    username: !secret web_server_username
    password: !secret web_server_password

network:
  enable_ipv6: ${ipv6_enable}

wifi:
  power_save_mode: NONE
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "${friendly_name} Fallback"
    password: !secret fallback_ap_password
  # Allow rapid re-connection to previously connected Wi-Fi.
  fast_connect: "${wifi_fast_connect}"
  domain: "${dns_domain}"

espnow:
  id: espnow_component
  auto_add_peer: false
  enable_on_boot: true

  # The first valid packet from an unknown remote arrives here. Pairing stores its MAC
  # in the selected logical slot. All ten AR01V3 units must use the same slot mapping.
  on_unknown_peer:
    - lambda: |-
        const char *const TAG = "espnow_10x10";
        id(remote_peer_add_pending) = false;
        id(remote_peer_delete_pending) = false;

        const bool valid_packet = size == 13 &&
          (data[0] == 0x91 || data[0] == 0x81 || data[0] == 0x80);
        if (!valid_packet) {
          ESP_LOGD(TAG, "Ignoring packet from %s, size=%u",
                   format_mac_address_pretty(info.src_addr).c_str(), size);
          return;
        }

        char src[18];
        snprintf(src, sizeof(src), "%02X:%02X:%02X:%02X:%02X:%02X",
                 info.src_addr[0], info.src_addr[1], info.src_addr[2],
                 info.src_addr[3], info.src_addr[4], info.src_addr[5]);
        id(remote_last_seen).publish_state(src);

        int existing_slot = 0;
        if (id(remote_paired_1) && memcmp(id(remote_mac_1).data(), info.src_addr, 6) == 0) existing_slot = 1;
        else if (id(remote_paired_2) && memcmp(id(remote_mac_2).data(), info.src_addr, 6) == 0) existing_slot = 2;
        else if (id(remote_paired_3) && memcmp(id(remote_mac_3).data(), info.src_addr, 6) == 0) existing_slot = 3;
        else if (id(remote_paired_4) && memcmp(id(remote_mac_4).data(), info.src_addr, 6) == 0) existing_slot = 4;
        else if (id(remote_paired_5) && memcmp(id(remote_mac_5).data(), info.src_addr, 6) == 0) existing_slot = 5;
        else if (id(remote_paired_6) && memcmp(id(remote_mac_6).data(), info.src_addr, 6) == 0) existing_slot = 6;
        else if (id(remote_paired_7) && memcmp(id(remote_mac_7).data(), info.src_addr, 6) == 0) existing_slot = 7;
        else if (id(remote_paired_8) && memcmp(id(remote_mac_8).data(), info.src_addr, 6) == 0) existing_slot = 8;
        else if (id(remote_paired_9) && memcmp(id(remote_mac_9).data(), info.src_addr, 6) == 0) existing_slot = 9;
        else if (id(remote_paired_10) && memcmp(id(remote_mac_10).data(), info.src_addr, 6) == 0) existing_slot = 10;
        if (existing_slot != 0) {
          for (size_t i = 0; i < 6; i++) id(remote_peer_add_mac)[i] = info.src_addr[i];
          id(remote_peer_add_pending) = true;
          if (id(remote_pairing)) {
            id(remote_pairing) = false;
            char status[48];
            snprintf(status, sizeof(status), "Already paired as Pilot %d", existing_slot);
            id(remote_pairing_status).publish_state(status);
          }
          ESP_LOGI(TAG, "Restoring known remote %s from slot %d", src, existing_slot);
          return;
        }

        if (!id(remote_pairing)) {
          ESP_LOGD(TAG, "Unpaired remote %s seen; enable pairing first", src);
          return;
        }

        const int slot = id(remote_pairing_slot);
        if (slot < 1 || slot > 10) {
          id(remote_pairing) = false;
          id(remote_pairing_status).publish_state("Invalid pairing slot");
          return;
        }

        if (slot == 1 && id(remote_paired_1)) {
          id(remote_peer_delete_mac) = id(remote_mac_1);
          id(remote_peer_delete_pending) = true;
        }
        else if (slot == 2 && id(remote_paired_2)) {
          id(remote_peer_delete_mac) = id(remote_mac_2);
          id(remote_peer_delete_pending) = true;
        }
        else if (slot == 3 && id(remote_paired_3)) {
          id(remote_peer_delete_mac) = id(remote_mac_3);
          id(remote_peer_delete_pending) = true;
        }
        else if (slot == 4 && id(remote_paired_4)) {
          id(remote_peer_delete_mac) = id(remote_mac_4);
          id(remote_peer_delete_pending) = true;
        }
        else if (slot == 5 && id(remote_paired_5)) {
          id(remote_peer_delete_mac) = id(remote_mac_5);
          id(remote_peer_delete_pending) = true;
        }
        else if (slot == 6 && id(remote_paired_6)) {
          id(remote_peer_delete_mac) = id(remote_mac_6);
          id(remote_peer_delete_pending) = true;
        }
        else if (slot == 7 && id(remote_paired_7)) {
          id(remote_peer_delete_mac) = id(remote_mac_7);
          id(remote_peer_delete_pending) = true;
        }
        else if (slot == 8 && id(remote_paired_8)) {
          id(remote_peer_delete_mac) = id(remote_mac_8);
          id(remote_peer_delete_pending) = true;
        }
        else if (slot == 9 && id(remote_paired_9)) {
          id(remote_peer_delete_mac) = id(remote_mac_9);
          id(remote_peer_delete_pending) = true;
        }
        else if (slot == 10 && id(remote_paired_10)) {
          id(remote_peer_delete_mac) = id(remote_mac_10);
          id(remote_peer_delete_pending) = true;
        }

        std::array<uint8_t, 6> new_mac{info.src_addr[0], info.src_addr[1], info.src_addr[2],
                                       info.src_addr[3], info.src_addr[4], info.src_addr[5]};
        if (slot == 1) {
          id(remote_mac_1) = new_mac;
          id(remote_paired_1) = true;
          id(remote_last_seq_1) = 0xFFFFFFFF;
          id(remote_paired_text_1).publish_state(src);
        }
        else if (slot == 2) {
          id(remote_mac_2) = new_mac;
          id(remote_paired_2) = true;
          id(remote_last_seq_2) = 0xFFFFFFFF;
          id(remote_paired_text_2).publish_state(src);
        }
        else if (slot == 3) {
          id(remote_mac_3) = new_mac;
          id(remote_paired_3) = true;
          id(remote_last_seq_3) = 0xFFFFFFFF;
          id(remote_paired_text_3).publish_state(src);
        }
        else if (slot == 4) {
          id(remote_mac_4) = new_mac;
          id(remote_paired_4) = true;
          id(remote_last_seq_4) = 0xFFFFFFFF;
          id(remote_paired_text_4).publish_state(src);
