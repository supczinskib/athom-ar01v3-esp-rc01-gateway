        else if (slot == 5) {
          id(remote_mac_5) = new_mac;
          id(remote_paired_5) = true;
          id(remote_last_seq_5) = 0xFFFFFFFF;
          id(remote_paired_text_5).publish_state(src);
        }
        else if (slot == 6) {
          id(remote_mac_6) = new_mac;
          id(remote_paired_6) = true;
          id(remote_last_seq_6) = 0xFFFFFFFF;
          id(remote_paired_text_6).publish_state(src);
        }
        else if (slot == 7) {
          id(remote_mac_7) = new_mac;
          id(remote_paired_7) = true;
          id(remote_last_seq_7) = 0xFFFFFFFF;
          id(remote_paired_text_7).publish_state(src);
        }
        else if (slot == 8) {
          id(remote_mac_8) = new_mac;
          id(remote_paired_8) = true;
          id(remote_last_seq_8) = 0xFFFFFFFF;
          id(remote_paired_text_8).publish_state(src);
        }
        else if (slot == 9) {
          id(remote_mac_9) = new_mac;
          id(remote_paired_9) = true;
          id(remote_last_seq_9) = 0xFFFFFFFF;
          id(remote_paired_text_9).publish_state(src);
        }
        else if (slot == 10) {
          id(remote_mac_10) = new_mac;
          id(remote_paired_10) = true;
          id(remote_last_seq_10) = 0xFFFFFFFF;
          id(remote_paired_text_10).publish_state(src);
        }

        id(remote_peer_add_mac) = new_mac;
        id(remote_peer_add_pending) = true;
        id(remote_pairing) = false;
        char status[48];
        snprintf(status, sizeof(status), "Pilot %d paired", slot);
        id(remote_pairing_status).publish_state(status);
        ESP_LOGI(TAG, "Paired remote %s as Pilot %d", src, slot);

    - if:
        condition:
          lambda: 'return id(remote_peer_delete_pending);'
        then:
          - espnow.peer.delete:
              id: espnow_component
              address: !lambda 'return id(remote_peer_delete_mac);'
    - if:
        condition:
          lambda: 'return id(remote_peer_add_pending);'
        then:
          - espnow.peer.add:
              id: espnow_component
              address: !lambda 'return id(remote_peer_add_mac);'
    - lambda: |-
        id(remote_peer_add_pending) = false;
        id(remote_peer_delete_pending) = false;

  on_receive:
    - if:
        condition:
          lambda: |-
            const char *const TAG = "espnow_10x10";
            const bool valid_packet = size == 13 &&
              (data[0] == 0x91 || data[0] == 0x81 || data[0] == 0x80);
            if (!valid_packet) return false;

            int slot = 0;
            if (id(remote_paired_1) && memcmp(id(remote_mac_1).data(), info.src_addr, 6) == 0) slot = 1;
            else if (id(remote_paired_2) && memcmp(id(remote_mac_2).data(), info.src_addr, 6) == 0) slot = 2;
            else if (id(remote_paired_3) && memcmp(id(remote_mac_3).data(), info.src_addr, 6) == 0) slot = 3;
            else if (id(remote_paired_4) && memcmp(id(remote_mac_4).data(), info.src_addr, 6) == 0) slot = 4;
            else if (id(remote_paired_5) && memcmp(id(remote_mac_5).data(), info.src_addr, 6) == 0) slot = 5;
            else if (id(remote_paired_6) && memcmp(id(remote_mac_6).data(), info.src_addr, 6) == 0) slot = 6;
